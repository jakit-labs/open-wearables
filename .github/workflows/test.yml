name: Backend tests

# jakit-labs/open-wearables is BH.Loop's hardening fork of
# the-momentum/open-wearables, cut at 6c2f28a3 (T-CYK-1009 AC-0).
# One job: the upstream backend pytest suite on Postgres.
# pull_request only, a read-only token, no secrets, GitHub-hosted runners.
on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # BH.Loop runs the sidecar database on Cloud SQL Postgres 16.
        image: postgres:16
        env:
          POSTGRES_USER: open-wearables
          POSTGRES_PASSWORD: open-wearables
          POSTGRES_DB: open_wearables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://open-wearables:open-wearables@localhost:5432/open_wearables_test
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LWZvci10ZXN0aW5nLW9ubHk=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # T-CYK-1009 CSO N3: a pinned action and a pinned uv tarball hash, no curl | sh.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          checksum: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
          enable-cache: false
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run tests
        working-directory: backend
        run: uv run pytest -v
