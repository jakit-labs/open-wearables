name: Backend tests

# jakit-labs/open-wearables is BH.Loop's hardening fork of
# the-momentum/open-wearables, cut at 6c2f28a3 (T-CYK-1009 AC-0).
# One job: the upstream backend pytest suite on Postgres.
# pull_request only, a read-only token, no secrets, GitHub-hosted runners.
on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: open-wearables
          POSTGRES_PASSWORD: open-wearables
          POSTGRES_DB: open_wearables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://open-wearables:open-wearables@localhost:5432/open_wearables_test
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LWZvci10ZXN0aW5nLW9ubHk=
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run tests
        working-directory: backend
        run: uv run pytest -v
